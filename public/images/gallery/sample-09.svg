<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="示例插画：流星雨之夜">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.75" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#101a38"/>
    </linearGradient>
    <linearGradient id="meteor" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dde6f7" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#55d6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#55d6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="meteorG" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd37a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd37a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f7bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8f7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <g fill="#dde6f7">
    <circle cx="60" cy="140" r="1.4" opacity="0.7"/>
    <circle cx="200" cy="240" r="1.1" opacity="0.5"/>
    <circle cx="330" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="520" cy="300" r="1.3" opacity="0.6"/>
    <circle cx="90" cy="420" r="1.1" opacity="0.5"/>
    <circle cx="430" cy="480" r="1.2" opacity="0.5"/>
    <circle cx="250" cy="380" r="1" opacity="0.45"/>
    <circle cx="540" cy="60" r="1.5" opacity="0.75"/>
    <circle cx="160" cy="560" r="1.1" opacity="0.45"/>
  </g>
  <circle cx="120" cy="150" r="80" fill="url(#moonGlow)"/>
  <circle cx="120" cy="150" r="42" fill="#101a38" stroke="#8f7bff" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M96 116 A42 42 0 0 1 152 122" fill="none" stroke="#dde6f7" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
  <g stroke-linecap="round">
    <line x1="520" y1="120" x2="330" y2="330" stroke="url(#meteor)" stroke-width="4"/>
    <line x1="580" y1="300" x2="420" y2="480" stroke="url(#meteor)" stroke-width="3"/>
    <line x1="420" y1="40" x2="260" y2="220" stroke="url(#meteor)" stroke-width="2.5"/>
    <line x1="360" y1="420" x2="230" y2="570" stroke="url(#meteorG)" stroke-width="3.5"/>
    <line x1="240" y1="300" x2="140" y2="410" stroke="url(#meteor)" stroke-width="2"/>
    <line x1="560" y1="520" x2="470" y2="620" stroke="url(#meteor)" stroke-width="2"/>
  </g>
  <circle cx="520" cy="120" r="4" fill="#dde6f7"/>
  <circle cx="360" cy="420" r="3.5" fill="#ffd37a"/>
  <circle cx="420" cy="40" r="2.5" fill="#dde6f7" opacity="0.9"/>
  <path d="M0 730 Q 150 660 320 700 T 600 690 L600 800 L0 800 Z" fill="#8f7bff" opacity="0.14"/>
