    <circle cx="250" cy="80" r="1.4" opacity="0.75"/>
    <circle cx="560" cy="300" r="1.2" opacity="0.6"/>
    <circle cx="60" cy="330" r="1" opacity="0.5"/>
    <circle cx="500" cy="720" r="1.3" opacity="0.6"/>
    <circle cx="90" cy="680" r="1.5" opacity="0.7"/>
