<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="示例插画：星环行星">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#101a38"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.28" r="1.05">
      <stop offset="0" stop-color="#8f7bff"/>
      <stop offset="0.55" stop-color="#4a3f96"/>
      <stop offset="1" stop-color="#151c3c"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#55d6ff" stop-opacity="0.45"/>
      <stop offset="0.7" stop-color="#55d6ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#55d6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55d6ff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#55d6ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#55d6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <g fill="#dde6f7">
    <circle cx="70" cy="90" r="1.6" opacity="0.9"/>
    <circle cx="160" cy="200" r="1.1" opacity="0.6"/>
    <circle cx="520" cy="120" r="1.8" opacity="0.85"/>
