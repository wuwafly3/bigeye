<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="示例插画：上升的光柱与晶片">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.6" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#101a38"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#55d6ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#55d6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f7bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8f7bff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8f7bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#55d6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#55d6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <g fill="#dde6f7">
    <circle cx="80" cy="120" r="1.4" opacity="0.7"/>
    <circle cx="520" cy="90" r="1.2" opacity="0.55"/>
    <circle cx="470" cy="260" r="1" opacity="0.45"/>
    <circle cx="120" cy="330" r="1.2" opacity="0.5"/>
    <circle cx="540" cy="430" r="1.1" opacity="0.5"/>
    <circle cx="70" cy="540" r="1.3" opacity="0.55"/>
    <circle cx="510" cy="640" r="1.2" opacity="0.5"/>
    <circle cx="150" cy="60" r="1" opacity="0.45"/>
  </g>
  <ellipse cx="300" cy="680" rx="240" ry="60" fill="url(#ground)"/>
  <ellipse cx="300" cy="680" rx="180" ry="42" fill="none" stroke="#55d6ff" stroke-opacity="0.35" stroke-width="1.5"/>
  <ellipse cx="300" cy="680" rx="120" ry="27" fill="none" stroke="#ffd37a" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="210" y="0" width="180" height="700" fill="url(#pillar)"/>
  <rect x="255" y="0" width="90" height="700" fill="url(#pillar2)"/>
  <g stroke-linejoin="round">
    <rect x="278" y="560" width="44" height="44" fill="none" stroke="#55d6ff" stroke-opacity="0.8" stroke-width="2.5" transform="rotate(45 300 582)"/>
    <rect x="282" y="420" width="36" height="36" fill="#8f7bff" fill-opacity="0.25" stroke="#8f7bff" stroke-opacity="0.8" stroke-width="2" transform="rotate(45 300 438)"/>
    <rect x="286" y="300" width="28" height="28" fill="none" stroke="#ffd37a" stroke-opacity="0.85" stroke-width="2" transform="rotate(45 300 314)"/>
    <rect x="290" y="200" width="20" height="20" fill="#55d6ff" fill-opacity="0.3" stroke="#55d6ff" stroke-opacity="0.7" stroke-width="1.5" transform="rotate(45 300 210)"/>
    <rect x="293" y="120" width="14" height="14" fill="none" stroke="#dde6f7" stroke-opacity="0.7" stroke-width="1.5" transform="rotate(45 300 127)"/>
  </g>
  <circle cx="300" cy="680" r="6" fill="#dde6f7"/>
  <circle cx="392" cy="500" r="2.5" fill="#ffd37a" opacity="0.8"/>
  <circle cx="215" cy="370" r="2" fill="#55d6ff" opacity="0.8"/>
</svg>
