<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="示例插画：棱镜之光">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f7bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8f7bff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="inbeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dde6f7" stop-opacity="0"/>
      <stop offset="1" stop-color="#dde6f7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="outc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#55d6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="outp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f7bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8f7bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="outg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd37a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd37a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g fill="#dde6f7">
    <circle cx="80" cy="80" r="1.4" opacity="0.7"/>
    <circle cx="700" cy="60" r="1.2" opacity="0.55"/>
    <circle cx="740" cy="520" r="1.5" opacity="0.6"/>
    <circle cx="120" cy="500" r="1.1" opacity="0.5"/>
    <circle cx="620" cy="140" r="1" opacity="0.45"/>
    <circle cx="200" cy="160" r="1.2" opacity="0.55"/>
    <circle cx="60" cy="320" r="1" opacity="0.4"/>
  </g>
  <polygon points="0,180 350,320 0,260" fill="url(#inbeam)"/>
  <polygon points="360,330 800,150 800,210" fill="url(#outc)"/>
  <polygon points="360,340 800,300 800,350" fill="url(#outp)"/>
  <polygon points="360,350 800,450 800,510" fill="url(#outg)"/>
  <polygon points="400,120 620,470 180,470" fill="url(#prism)" stroke="#55d6ff" stroke-opacity="0.6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="400,250 500,430 300,430" fill="none" stroke="#ffd37a" stroke-opacity="0.55" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="400" cy="120" r="5" fill="#dde6f7"/>
  <circle cx="400" cy="120" r="12" fill="none" stroke="#55d6ff" stroke-opacity="0.4"/>
  <circle cx="180" cy="470" r="3.5" fill="#8f7bff"/>
  <circle cx="620" cy="470" r="3.5" fill="#ffd37a"/>
</svg>
