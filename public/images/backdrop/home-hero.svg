<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 占位背景：嘉年华天空（天空蓝渐变 + 青色漩涡 + 摩天轮线稿 + 气球彩纸）
       将官方主视觉存为同目录 home-hero.jpg 即可自动替换本图 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9dcf3"/>
      <stop offset="0.55" stop-color="#d8ebf8"/>
      <stop offset="1" stop-color="#eff5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#8fd0f2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fd0f2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1920" height="1000" fill="url(#sky)"/>
  <rect width="1920" height="1000" fill="url(#glow)"/>

  <!-- 远处云团 -->
  <g filter="url(#soft)" fill="#ffffff">
    <ellipse cx="330" cy="700" rx="360" ry="110" opacity="0.55"/>
    <ellipse cx="1030" cy="810" rx="470" ry="130" opacity="0.5"/>
    <ellipse cx="1660" cy="680" rx="330" ry="100" opacity="0.5"/>
    <ellipse cx="760" cy="160" rx="260" ry="70" opacity="0.35"/>
  </g>

  <!-- 青色漩涡环 -->
  <g fill="none" stroke-linecap="round">
    <circle cx="1310" cy="430" r="300" stroke="#3fb3e8" stroke-width="26" opacity="0.20"
            stroke-dasharray="900 1000" transform="rotate(-30 1310 430)"/>
    <circle cx="1310" cy="430" r="225" stroke="#6ec8f0" stroke-width="16" opacity="0.26"
            stroke-dasharray="620 800" transform="rotate(120 1310 430)"/>
    <circle cx="1310" cy="430" r="150" stroke="#a5dcf6" stroke-width="34" opacity="0.22"
            stroke-dasharray="360 600" transform="rotate(240 1310 430)"/>
    <circle cx="520" cy="270" r="170" stroke="#57bdeb" stroke-width="14" opacity="0.16"
            stroke-dasharray="440 620" transform="rotate(45 520 270)"/>
  </g>

  <!-- 摩天轮线稿 -->
  <g stroke="#7fb8d9" fill="none" opacity="0.4">
    <circle cx="290" cy="430" r="200" stroke-width="3"/>
    <circle cx="290" cy="430" r="150" stroke-width="1.5"/>
    <circle cx="290" cy="430" r="10" stroke-width="3"/>
    <g stroke-width="1.5">
      <line x1="290" y1="230" x2="290" y2="630"/>
      <line x1="90" y1="430" x2="490" y2="430"/>
      <line x1="149" y1="289" x2="431" y2="571"/>
      <line x1="431" y1="289" x2="149" y2="571"/>
    </g>
    <path d="M200 780 L290 440 L380 780" stroke-width="3"/>
    <g fill="#7fb8d9" stroke="none" opacity="0.8">
      <circle cx="290" cy="230" r="9"/><circle cx="431" cy="289" r="9"/>
      <circle cx="490" cy="430" r="9"/><circle cx="431" cy="571" r="9"/>
      <circle cx="290" cy="630" r="9"/><circle cx="149" cy="571" r="9"/>
      <circle cx="90" cy="430" r="9"/><circle cx="149" cy="289" r="9"/>
    </g>
  </g>

  <!-- 过山车轨道弧线 -->
  <g stroke="#8ec4e2" fill="none" opacity="0.35">
    <path d="M980 900 C 1150 640, 1420 640, 1580 880 S 1860 980, 1920 820" stroke-width="4"/>
    <path d="M980 930 C 1150 670, 1420 670, 1580 910 S 1860 1010, 1920 850" stroke-width="2"/>
  </g>

  <!-- 气球 -->
  <g stroke-width="1.5">
    <g opacity="0.85">
      <circle cx="180" cy="150" r="34" fill="#f2708f"/>
      <path d="M180 184 q6 26 -4 52" stroke="#e0a4b2" fill="none"/>
    </g>
    <g opacity="0.8">
      <circle cx="1740" cy="210" r="26" fill="#f0b23a"/>
      <path d="M1740 236 q-6 22 4 44" stroke="#d9c08a" fill="none"/>
    </g>
    <g opacity="0.75">
      <circle cx="640" cy="120" r="20" fill="#8b7ce0"/>
      <path d="M640 140 q5 18 -3 36" stroke="#b3a9e8" fill="none"/>
    </g>
    <g opacity="0.7">
      <circle cx="1520" cy="120" r="16" fill="#2fbfa8"/>
      <path d="M1520 136 q-4 16 3 30" stroke="#9ed4ca" fill="none"/>
    </g>
    <g opacity="0.8">
      <circle cx="900" cy="90" r="14" fill="#ef6a6a"/>
      <path d="M900 104 q4 14 -2 26" stroke="#dda4a4" fill="none"/>
    </g>
  </g>

  <!-- 彩纸 -->
  <g opacity="0.75">
    <rect x="420" y="330" width="12" height="12" fill="#f2708f" transform="rotate(24 426 336)"/>
    <rect x="760" y="250" width="10" height="10" fill="#f0b23a" transform="rotate(-18 765 255)"/>
    <rect x="1120" y="180" width="11" height="11" fill="#2fbfa8" transform="rotate(40 1125 185)"/>
    <rect x="1620" y="420" width="12" height="12" fill="#8b7ce0" transform="rotate(-30 1626 426)"/>
    <rect x="1460" y="640" width="10" height="10" fill="#f2708f" transform="rotate(12 1465 645)"/>
    <rect x="240" y="640" width="10" height="10" fill="#f0b23a" transform="rotate(-24 245 645)"/>
    <circle cx="580" cy="520" r="6" fill="#57bdeb"/>
    <circle cx="990" cy="420" r="5" fill="#f2708f"/>
    <circle cx="1240" cy="720" r="6" fill="#f0b23a"/>
    <circle cx="860" cy="620" r="5" fill="#8b7ce0"/>
  </g>
</svg>
