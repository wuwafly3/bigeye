<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f8"/>
      <stop offset="0.6" stop-color="#dde5ee"/>
      <stop offset="1" stop-color="#d0dae6"/>
    </linearGradient>
    <radialGradient id="glow-amber" cx="75%" cy="18%" r="68%">
      <stop offset="0" stop-color="rgba(245,158,11,0.09)"/>
      <stop offset="0.55" stop-color="rgba(245,158,11,0.03)"/>
      <stop offset="1" stop-color="rgba(245,158,11,0)"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="14%" cy="72%" r="60%">
      <stop offset="0" stop-color="rgba(6,182,212,0.09)"/>
      <stop offset="0.6" stop-color="rgba(6,182,212,0.02)"/>
      <stop offset="1" stop-color="rgba(6,182,212,0)"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 L0 0 0 64" fill="none" stroke="rgba(100,116,139,0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 银冰画布 -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow-amber)"/>
  <rect width="1600" height="900" fill="url(#glow-cyan)"/>

  <!-- 扫描同心环（design.md radiar rings） -->
  <g fill="none" stroke="rgba(6,182,212,0.5)">
    <circle cx="1380" cy="180" r="120" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="1380" cy="180" r="180" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 6"/>
    <circle cx="1380" cy="180" r="62" stroke-opacity="0.6" stroke-width="1.4"/>
    <!-- 十字瞄准线 -->
    <path d="M1380 36 v36 M1380 288 v36 M1236 180 h36 M1488 180 h36" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>

  <!-- 琥珀小点：荔枝感丝 -->
  <g fill="#f59e0b" opacity="0.8">
    <circle cx="240" cy="220" r="1.6"/>
    <circle cx="420" cy="340" r="1.2"/>
    <circle cx="660" cy="120" r="1.5"/>
    <circle cx="940" cy="260" r="1"/>
  </g>
</svg>
